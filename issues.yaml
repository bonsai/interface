ontology:
  provisional_definition: >-
    Interface は、異なる存在・モデル・環境のあいだで、差異を観測可能にし、
    意味を翻訳し、行為可能性を生成し、関係と境界そのものを変化させる媒介過程。
  flow:
    - World
    - Difference
    - Boundary / Cut
    - Interface
    - Observation
    - Translation
    - Mediation
    - Affordance
    - Coordination
    - Action
    - Transformation / Event
    - New State / New Relation
  principles:
    - "Interface is not merely an API or endpoint."
    - "Interface is a relation/process as well as an object."
    - "Interface is a mediator, not a transparent pipe."
    - "Interface can generate boundaries, not only connect them."
    - "Interface handles state, action, meaning, capability, and events."
    - "Interface can be multi-party."
    - "Error, ambiguity, and misdelivery are first-class phenomena."
    - "Interface can transform actors, models, and environments."
    - "Interface can mediate between multiple models of one world."

