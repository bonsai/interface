version: "0.2"
purpose: >
  Declare philosophical positions as machine-readable descriptions of
  relations, boundaries, transformations, and possibilities.

model: declarative

rules:
  - philosophy_is_not_implementation
  - concepts_are_declarations
  - declarations_describe_relations
  - declarations_may_constrain_interfaces
  - declarations_do_not_execute
  - world_is_singular
  - models_are_multiple

schema:
  declaration:
    - philosopher
    - concept
    - claim
    - relation
    - interface
    - effect

philosophers:
  simondon:
    name: Gilbert Simondon
    concept: transduction
    claim: Relation produces transformation across a boundary.
    relation:
      between: [difference, interface, transformation]
    interface:
      transforms: relation
    effect:
      produces: [new_relation, new_state]

  latour:
    name: Bruno Latour
    concept: mediator
    claim: A mediator transforms what passes through it.
    relation:
      between: [actor, mediator, transformation]
    interface:
      is: mediator
      transforms: [input, output, relation]
    effect:
      produces: transformed_relation

  deleuze:
    name: Gilles Deleuze
    concept: difference_and_becoming
    claim: Difference produces events and new states.
    relation:
      between: [difference, encounter, event, becoming]
    interface:
      site_of: becoming
    effect:
      produces: state_change

  nancy:
    name: Jean-Luc Nancy
    concept: being_with
    claim: Being is constituted through relation with others.
    relation:
      between: [self, other, between]
    interface:
      exists_through: relation
    effect:
      produces: relation_formed

  derrida:
    name: Jacques Derrida
    concept: differance_and_translation
    claim: Meaning emerges through difference and deferred translation.
    relation:
      between: [difference, trace, translation, misdelivery]
    interface:
      preserves: difference
      permits: [translation, reinterpretation, misdelivery]
    effect:
      produces: changed_meaning

  foucault:
    name: Michel Foucault
    concept: dispositif
    claim: Arrangements organize what can be said, seen, and done.
    relation:
      between: [power, knowledge, action]
    interface:
      configures: possible_actions
    effect:
      produces: changed_action_space

  luhmann:
    name: Niklas Luhmann
    concept: system_boundary
    claim: A system distinguishes itself from its environment through boundaries.
    relation:
      between: [system, boundary, environment]
    interface:
      selects: what_crosses_boundary
    effect:
      produces: selected_information

  mcluhan:
    name: Marshall McLuhan
    concept: medium
    claim: The medium shapes the environment of communication and action.
    relation:
      between: [medium, environment, interaction]
    interface:
      shapes: interaction_conditions
    effect:
      produces: changed_interaction_pattern

  gibson:
    name: James J. Gibson
    concept: affordance
    claim: An environment offers action possibilities to an organism.
    relation:
      between: [agent, environment, action]
    interface:
      exposes: action_possibilities
      constrains: action_possibilities
    effect:
      produces: action_available

  bateson:
    name: Gregory Bateson
    concept: difference_that_makes_a_difference
    claim: Information is a difference that changes a system.
    relation:
      between: [difference, observation, change]
    interface:
      makes_observable: relevant_difference
    effect:
      produces: state_update

  barad:
    name: Karen Barad
    concept: intra_action
    claim: Entities and boundaries emerge through relations.
    relation:
      between: [relation, boundary, emergence]
    interface:
      participates_in: [identity, boundary]
    effect:
      produces: boundary_generated

  merleau_ponty:
    name: Maurice Merleau-Ponty
    concept: lived_body
    claim: Perception is constituted through the body's engagement with the world.
    relation:
      between: [body, perception, world]
    interface:
      mediates: embodied_perception
    effect:
      produces: embodied_understanding

  whitehead:
    name: Alfred North Whitehead
    concept: actual_occasion
    claim: Reality consists of processes of becoming, not static substances.
    relation:
      between: [process, event, actual_occasion]
    interface:
      site_of: actualization
    effect:
      produces: new_actual_occasion

  delanda:
    name: Manuel DeLanda
    concept: assemblage
    claim: Heterogeneous components produce emergent properties through their relations.
    relation:
      between: [parts, relations, emergent_properties]
    interface:
      assembles: heterogeneous_components
    effect:
      produces: emergent_capability

  stiegler:
    name: Bernard Stiegler
    concept: epiphylogenesis
    claim: Technology serves as externalized memory that constitutes human temporality.
    relation:
      between: [human, technology, memory]
    interface:
      externalizes: memory
      preserves: memory
    effect:
      produces: expanded_temporal_horizon

  haraway:
    name: Donna Haraway
    concept: companion_species
    claim: Boundaries between species are constituted through mutual co-creation.
    relation:
      between: [human, non_human, co_constitution]
    interface:
      blurs: species_boundaries
    effect:
      produces: mutual_co_creation
